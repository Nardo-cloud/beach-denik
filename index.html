<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: one narrow column like a scorer's clipboard under a sand-court hero with a net band; sticky tab bar (Den / Týden / Měsíc); sand = písek, indigo = posilovna */
/* Club look (from the Prague Beach Team mark): deep navy ground, white hairlines, square corners, one sand accent. Single deliberate dark look. */
:root{
  --bg:#0E1B2B; --surface:#0E1B2B; --raise:#13243A; --ink:#F3F6F9; --muted:#93A4B6; --line:#2A3C52; --line2:#3B506A;
  --accent:#E9B44C; --accent-ink:#0E1B2B; --hi:#E9B44C;
  --rec:#5ED1C2; --sleep:#9AA9F0; --feel:#F0A05A; --food:#7FD39A; --sand:#E9B44C; --sand-soft:#2A2A2A; --gym:#B6A2F2; --gym-soft:#1F2340;
  --am:#E9B44C; --pm:#7FC7F0; --good:#6FCF8E; --warn:#E9B44C; --bad:#F07A6A;
  --hero:#13243A; --hero-ink:#F3F6F9; --hero-acc:#E9B44C; --netc:rgba(243,246,249,.28); --tape:#F3F6F9; --grain:transparent; --grain-d:rgba(0,0,0,.35);
  --sky:#0E1B2B; --sea:#0E1B2B; --sea2:#0E1B2B; --sun:#E9B44C; --ink-l:#F3F6F9;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-label:"Archivo Narrow","Arial Narrow",Arial,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px}
.hero{position:relative;border-radius:18px;overflow:hidden;background:var(--sky);color:var(--hero-ink);margin-block:6px 10px}
.hero-in{padding:16px 16px 0;display:flex;flex-direction:column;gap:2px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,8.2vw,40px);line-height:.95;overflow-wrap:anywhere;letter-spacing:.01em;margin:0;text-transform:uppercase}
h1 span{color:var(--hero-acc);display:block}
.scene{display:block;width:100%;height:auto;margin-top:-10px}
.scene .sun{fill:var(--sun)} .scene .gull{fill:none;stroke:var(--hero-ink);stroke-width:1.6;stroke-linecap:round;opacity:.6}
.scene .sea{fill:var(--sea)} .scene .wave{fill:none;stroke:var(--sea2);stroke-width:2;stroke-linecap:round}
.scene .sand{fill:var(--hero);stroke:var(--ink-l);stroke-width:1.5;stroke-opacity:.35}
.scene .tape{fill:none;stroke:var(--tape);stroke-width:4.5;stroke-linejoin:round}
.scene .tape2{stroke:var(--tape);stroke-width:2.5}
.scene .post{stroke:var(--ink-l);stroke-width:5;stroke-linecap:round}
.scene .band{fill:var(--tape);stroke:var(--ink-l);stroke-width:1;stroke-opacity:.5}
.scene .ant{stroke:#D8443A;stroke-width:3;stroke-dasharray:5 4}
.scene .prints ellipse,.scene .bshadow{fill:var(--grain-d)}
.scene .trail{fill:none;stroke:var(--hero-ink);stroke-width:2;stroke-dasharray:2 7;stroke-linecap:round;opacity:.45}
.scene .bw{fill:#FBF8F1} .scene .b1{stroke:var(--hero-acc)} .scene .b2{stroke:var(--am)} .scene .seam{stroke:#1B2A3A;stroke-opacity:.35}
.scene .pl .limb{fill:none;stroke:#D7956A;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.scene .pl .skin{fill:#D7956A}
.scene .pl .hair{fill:#4A2E1C;stroke:#4A2E1C;stroke-width:2.2;stroke-linecap:round}
.scene .pl .shorts{fill:#1B2A3A}
.scene .pl .top{fill:var(--hero-acc)}
.scene .jump .pl .top{fill:var(--am)}
.scene .pl path,.scene .pl circle{stroke-linejoin:round}
.scene .outline{stroke:#1B2A3A;stroke-width:3}
@media (prefers-reduced-motion:no-preference){
  .scene .bob{animation:bob 2.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
  .scene .bshadow{animation:shad 2.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
  .scene .jump{animation:jump 2.6s ease-in-out infinite alternate}
  @keyframes jump{from{transform:translateY(0)}to{transform:translateY(-4px)}}
  @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-6px) rotate(14deg)}}
  @keyframes shad{from{transform:scale(1)}to{transform:scale(.8);opacity:.7}}}
.club{display:block;align-self:flex-start;height:56px;width:auto;border-radius:10px;margin-bottom:10px;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.hero-sub{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;margin-top:6px}
.status{font-size:12px;color:var(--hero-ink);opacity:.75;margin-top:2px}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;margin-bottom:12px}
nav.tabs .seg3{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
nav.tabs a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.06em;text-transform:uppercase;padding:7px 4px;border-radius:999px}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--hi)}
nav.tabs a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.log{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.lday{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.lday .hd{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.lday .dt{font-family:var(--f-display);font-weight:700;font-size:19px;text-transform:uppercase;margin-right:auto}
.lday .tag{font-size:12px;color:var(--muted)}
.lrow{display:flex;gap:8px;font-size:14px;padding-block:3px;align-items:baseline}
.lrow .k{flex:none;width:92px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:color-mix(in srgb,var(--c,var(--muted)) 80%,var(--ink))}
.lrow .v{min-width:0;flex:1}
.lnote{font-style:italic;color:var(--muted);font-size:14px;margin-top:4px}
.lweek{background:color-mix(in srgb,var(--feel) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--feel) 40%,var(--line));border-radius:14px;padding:12px}
.lweek h4{margin:0 0 6px;font-family:var(--f-display);font-size:18px;text-transform:uppercase;letter-spacing:.04em;display:flex;gap:8px;align-items:center}
details.exp{padding:12px 14px} details.exp summary{cursor:pointer;display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.05em;text-transform:uppercase;list-style:none}
details.exp summary::-webkit-details-marker{display:none}
details.exp[open] summary{margin-bottom:10px}
.hbars{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.hb{display:flex;flex-direction:column;gap:4px}
.hb .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.hb .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.hb .v{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1;font-variant-numeric:tabular-nums}
.hb .v small{font-family:var(--f-body);font-size:12px;font-weight:600;margin-left:6px;padding:2px 7px;border-radius:999px;vertical-align:2px}
.hb .tr{position:relative;height:16px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.hb .fl{position:absolute;inset:0 auto 0 0;border-radius:8px}
.hb .mk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.axis{position:relative;height:16px;margin-top:2px;font-size:11px;color:var(--muted)}
.axis span{position:absolute;transform:translateX(-50%)} .axis span:first-child{transform:none} .axis span:last-child{transform:translateX(-100%)}
.mklab{font-size:11px;font-weight:600;color:var(--ink);text-align:right;margin-bottom:-6px}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--surface);font-size:13px;font-weight:600;padding:6px 10px;border-radius:8px;max-width:min(320px,90vw);white-space:normal;text-align:center;transform:translate(-50%,calc(-100% - 12px))}
.tipt{cursor:pointer}
@media (prefers-reduced-motion:no-preference){section.blk.flash{animation:flash 1.6s ease-out}@keyframes flash{0%,40%{box-shadow:0 0 0 4px color-mix(in srgb,var(--c,var(--accent)) 55%,transparent)}100%{box-shadow:0 0 0 0 transparent}}}
.coachbar{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--hi);border-radius:14px;padding:8px 12px;margin-bottom:12px}
.coachbar label{font-family:var(--f-display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:14px}
.coachbar select{flex:1;min-width:0;font:inherit;font-weight:600;color:var(--ink);background:var(--surface);border:0;border-radius:10px;padding:8px 10px}
.banner{background:var(--sand-soft);border:1px solid var(--sand);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.datebar{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 72px);display:flex;align-items:center;gap:8px;margin-bottom:16px}
.datebar .lbl{flex:1;min-width:0;text-align:center}
.datebar .day{font-family:var(--f-display);font-weight:700;font-size:32px;text-transform:uppercase;line-height:1}
.datebar .sub{font-size:13px;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
.icon{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1;display:grid;place-items:center}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0}
section.blk{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 72px);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 0 var(--line);padding:14px;margin-bottom:12px}
.blk h2{font-family:var(--f-display);font-weight:600;font-size:19px;letter-spacing:.05em;text-transform:uppercase;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.ib{width:30px;height:30px;border-radius:9px;display:inline-grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib-sleep{--c:var(--sleep)} .ib-feel{--c:var(--feel)} .ib-food{--c:var(--food)} .ib-ac{--c:var(--accent)} .ib-sand{--c:var(--sand)} .ib-gym{--c:var(--gym)} .ib-am{--c:var(--am)} .ib-ink{--c:var(--ink)}
section.blk[class*=" c-"]{background:color-mix(in srgb,var(--c) 9%,var(--surface));border-color:color-mix(in srgb,var(--c) 38%,var(--line));box-shadow:0 2px 0 color-mix(in srgb,var(--c) 30%,transparent)}
section.blk[class*=" c-"]>h2{color:color-mix(in srgb,var(--c) 72%,var(--ink))}
section.blk[class*=" c-"] :is(input,textarea,.feel button:not([aria-pressed="true"]),.chip:not([aria-pressed="true"]),.rpe button:not([aria-pressed="true"]),.seg button:not([aria-pressed="true"]),.add,.offbox){background:var(--surface)}
.c-sleep,.t-sleep{--c:var(--sleep)} .c-feel,.t-feel{--c:var(--feel)} .c-food,.t-food{--c:var(--food)} .c-sand,.t-sand{--c:var(--sand)} .c-gym,.t-gym{--c:var(--gym)} .c-ac,.t-ac{--c:var(--accent)} .t-rec{--c:var(--rec)}
.tile[class*=" t-"]{background:color-mix(in srgb,var(--c) 12%,var(--surface));border-color:color-mix(in srgb,var(--c) 40%,var(--line))}
.tile[class*=" t-"] .k{color:color-mix(in srgb,var(--c) 80%,var(--ink))}
.tile[class*=" t-"] .v{color:color-mix(in srgb,var(--c) 55%,var(--ink))}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.dot.am{background:var(--am)} .dot.pm{background:var(--pm)} .dot.sl{background:var(--ink);opacity:.75}
.dot.sand{background:var(--sand)} .dot.gym{background:var(--gym)} .dot.ac{background:var(--accent)}
.blk h2 .tot{margin-left:auto;font-family:var(--f-body);font-size:13px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
.sess{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.sess .n{font-family:var(--f-display);font-weight:600;font-size:16px;min-width:64px;color:var(--muted)}
.sess input{width:84px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 10px;font-size:13px}
.chip:hover{border-color:var(--accent)}
.rm{border:0;background:none;color:var(--muted);font-size:18px;padding:4px 8px;margin-left:auto}
.add{border:1px dashed var(--line);background:none;border-radius:10px;flex:1;padding:10px;color:var(--accent);font-weight:600}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.gdet{flex-basis:100%;display:flex;flex-direction:column;gap:8px;padding:8px 0 12px;border-bottom:1px solid var(--line)}
.gdet .t{font-size:13px;font-weight:600;color:var(--muted)}
.gtags{font-size:12px;color:var(--muted);white-space:normal}
.rpe{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rpe button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 0;font-weight:600;font-size:14px}
.rpe button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rpe button[aria-pressed="true"]:is([data-rpe="5"],[data-rpe="6"]){background:var(--warn);border-color:var(--warn);color:var(--surface)}
.rpe button[aria-pressed="true"]:is([data-rpe="7"],[data-rpe="8"]){background:var(--am);border-color:var(--am);color:var(--surface)}
.rpe button[aria-pressed="true"]:is([data-rpe="9"],[data-rpe="10"]){background:var(--bad);border-color:var(--bad);color:var(--surface)}
.rpel{font-size:12px;color:var(--muted);min-height:1em}
.plan-row{display:flex;align-items:center;gap:10px;padding-block:4px}
.plan-row .l{flex:1;font-size:14px}
.plan-row .v{min-width:34px;text-align:center;font-family:var(--f-display);font-weight:700;font-size:20px}
.step{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:20px;line-height:1}
.cmp{display:flex;flex-direction:column;gap:12px}
.cmp .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px;gap:8px}
.cmp .ok{color:var(--good);font-weight:600}
.cmp .left{color:var(--muted)}
.bars{display:flex;gap:4px}
.bars span{flex:1;height:10px;border-radius:3px;background:var(--bg);border:1px solid var(--line)}
.bars span.f-sand{background:var(--sand);border-color:var(--sand)}
.bars span.f-gym{background:var(--gym);border-color:var(--gym)}
.bars span.f-rest{background:var(--sand-soft);border-color:var(--sand)}
.save{border:0;background:var(--ink);color:var(--hi);border-radius:10px;padding:10px 18px;font-weight:600;min-width:110px}
.save.done{background:var(--good)}
.save:disabled{opacity:.7}
.skip{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 14px;color:var(--muted);font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:.04em;text-transform:uppercase}
.seg button[aria-pressed="true"].yes{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg button[aria-pressed="true"].no{background:var(--sand-soft);border-color:var(--sand);color:var(--ink)}
.offbox{background:var(--bg);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.offbox .h{display:flex;align-items:center;gap:8px;font-weight:600}
.offbox .h .link{margin-left:auto}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--hi)}
.offtag{color:var(--muted);font-style:italic}
input[type=number],input[type=text],input[type=date],input[type=month],textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{width:100%;resize:vertical;min-height:40px}
.unit{font-size:13px;color:var(--muted)}
.feel{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.feel button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px}
.feel button b{font-family:var(--f-display);font-size:22px;line-height:1}
.feel button small{font-size:11px;color:var(--muted)}
.feel button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.feel button[aria-pressed="true"] small{color:var(--accent-ink)}
.feel button[aria-pressed="true"]:is([data-v="1"],[data-v="2"]),.feel:is([data-feel="stress"],[data-feel="fatigue"]) button[aria-pressed="true"]:is([data-v="4"],[data-v="5"]){background:var(--bad);border-color:var(--bad);color:var(--surface)}
.feel button[aria-pressed="true"][data-v="3"]{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.feel button[aria-pressed="true"]:is([data-v="4"],[data-v="5"]),.feel:is([data-feel="stress"],[data-feel="fatigue"]) button[aria-pressed="true"]:is([data-v="1"],[data-v="2"]){background:var(--good);border-color:var(--good);color:var(--surface)}
.feel button[aria-pressed="true"] small{color:inherit;opacity:.9}
.feelrow+.feelrow{margin-top:14px}
.feelrow .t{font-weight:600;font-size:14px;margin-bottom:6px}
.meal{display:grid;grid-template-columns:1fr;gap:8px;align-items:start;padding-block:8px;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0;padding-top:0}
.meal label{grid-column:1/-1;font-weight:600;font-size:14px}
.meal textarea{min-width:0}
.meal .kc{display:flex;flex-direction:column;gap:2px}
.meal .kc input{width:100%}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
  .tbl{overflow:visible;border:0;background:none}
  .tbl table,.tbl tbody,.tbl tfoot{display:block}
  .tbl thead{display:none}
  .tbl tr{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
  .tbl tfoot tr{background:color-mix(in srgb,var(--accent) 10%,var(--surface));border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
  .tbl td{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:0;padding:7px 9px;white-space:normal;min-width:0;border-radius:10px;font-weight:600;font-size:15px;
    --c:var(--accent);background:color-mix(in srgb,var(--c) 9%,var(--surface))}
  .tbl td[data-cat="sleep"]{--c:var(--sleep)} .tbl td[data-cat="sand"]{--c:var(--sand)} .tbl td[data-cat="gym"]{--c:var(--gym)} .tbl td[data-cat="rec"]{--c:var(--rec)} .tbl td[data-cat="feel"]{--c:var(--feel)} .tbl td[data-cat="food"]{--c:var(--food)}

const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,"0");
const key=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());

const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const dow=d=>(d.getDay()+6)%7;
const monday=d=>addDays(d,-dow(d));
const today=()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())};
const isoWeek=d=>{const t=new Date(d);t.setDate(t.getDate()+3-dow(t));const y=new Date(t.getFullYear(),0,4);return 1+Math.round(((t-y)/864e5-3+dow(y))/7)};
const fmtMin=m=>{m=Math.round(m||0);if(!m)return"0 min";const h=Math.floor(m/60),r=m%60;return h?(h+" h"+(r?" "+r+" min":"")):r+" min"};
const fmtShort=m=>{m=Math.round(m||0);const h=Math.floor(m/60),r=m%60;return h?(h+"h"+(r?" "+r:"")):r+"m"};
const fmtH=h=>fmtMin(Math.round((h||0)*60/5)*5);
const num=v=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)&&n>0?n:0};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function blank(){return{sleep:0,go:{},off:{},sand:[],gym:[],morning:0,fatigue:0,meals:{},note:""}}
function getWeek(id){return wdirty[id]||weeks[id]||null}
function hasWeek(w){return !!(w&&(w.rating||(w.recov||[]).length||REVIEW.some(([k])=>(w[k]||"").trim())))}
function getDay(id){return dirty[id]||docs[id]||null}
function sumMin(a){return(a||[]).reduce((s,x)=>s+(Number(x.min)||0),0)}
const ate=m=>!!m&&(m.had===true||(m.had!==false&&!!(m.text||"").trim()));
const mealState=(d,k)=>{const m=d?.meals?.[k];if(!m)return null;if(m.had===true||m.had===false)return m.had;return (m.text||"").trim()?true:null};
function mealsCount(d){return Object.values(d?.meals||{}).filter(ate).length}
function hasData(d){return d&&(d.sleep||d.sleepQ||d.stress||d.go?.sand||d.go?.gym||d.off?.sand||d.off?.gym||(d.sand||[]).length||(d.gym||[]).length||d.morning||d.fatigue||mealsCount(d)||(d.note||"").trim())}

function setStatus(t){$("#status").textContent=t}

/* ---------- saving ---------- */
function queueSave(id,body,col){
  if(mode==="db"&&!base){setStatus("Nejdřív vyber hráčku.");return}
  col=col||"days"; (col==="days"?dirty:wdirty)[id]=body; setStatus("Ukládám…");
  clearTimeout(pending[col+id]);
  pending[col+id]=setTimeout(()=>{const p=flush(id,col);if(p)p.catch(()=>{})},700);
}
function flush(id,col){
  const D=col==="days"?dirty:wdirty, has=col==="days"?hasData:hasWeek;
  const body=D[id]; if(!body||!store)return;
  const clean=JSON.parse(JSON.stringify(body)); delete clean.sample;
  const k=col+id;
  chains[k]=(chains[k]||Promise.resolve()).then(()=>(has(clean)?store.save(col,id,clean):store.remove(col,id))).then(()=>{
    if(D[id]===body){delete D[id]}
    const M=col==="days"?docs:weeks; if(has(clean))M[id]=clean; else delete M[id];
    setStatus("Uloženo "+new Date().toLocaleTimeString("cs-CZ",{hour:"2-digit",minute:"2-digit"}));
  }).catch(e=>{
    setStatus(e&&e.code==="quota_exceeded"?"Úložiště je plné – smažte staré dny.":"Neuloženo – zkontrolujte připojení a zkuste změnu znovu.");
    throw e;
  });
  return chains[k];
}

/* ---------- routing ---------- */
function route(){
  const v=(location.hash||"#den").slice(1);
  const view=["den","tyden","mesic"].includes(v)||(v==="trener"&&isCoach)?v:"den";
  for(const t of ["den","tyden","mesic","trener"]){const a=$("#tab-"+t);if(t===view)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")}
  render(view,true);
}
let currentView="den";
let isCoach=false;
function render(view,force){
  currentView=view||currentView;
  if(currentView==="den")renderDay(force);
  else if(currentView==="tyden")renderWeek(force);
  else if(currentView==="trener")renderCoach();
  else renderMonth();
  renderBanner();
}

function renderBanner(){
  const hasSample=Object.values(docs).some(d=>d&&d.sample)||Object.values(weeks).some(d=>d&&d.sample);
  let h="";
  if(mode==="local")h+=`<div class="banner"><span>Záznamy se teď ukládají jen v tomto prohlížeči.</span></div>`;
  if(hasSample)h+=`<div class="banner"><span>Tohle je ukázková hráčka s vyplněným týdnem 19.–25. října, ať vidíš, jak přehledy vypadají.</span><button class="link" id="delSample">Smazat ukázku</button></div>`;
  $("#banner").innerHTML=h;
  const b=$("#delSample"); if(b)b.onclick=async()=>{const wasSample=selPid==="ukazka";b.disabled=true;b.textContent="Mažu…";for(const [id,d] of Object.entries(docs)){if(d&&d.sample){try{await store.remove("days",id)}catch(e){}delete docs[id]}}for(const [id,d] of Object.entries(weeks)){if(d&&d.sample){try{await store.remove("weeks",id)}catch(e){}delete weeks[id]}}if(wasSample&&DB){try{await DB.doc("players/ukazka").delete()}catch(e){}}render(null,true)};
}

const FACES=["","😫","😕","😐","🙂","😄"];
function feelBtns(v,p,L){L=L||FEEL;const inv=L===FATIG||L===STRESS;return [1,2,3,4,5].map(n=>`<button type="button" id="${p}${n}" data-v="${n}" aria-pressed="${v===n}" aria-label="${n} – ${L[n]}"><b class="face" aria-hidden="true">${FACES[inv?6-n:n]}</b><small>${L[n]}</small></button>`).join("")}

/* ---------- aggregates ---------- */
function agg(ids){
  const r={days:0,sandN:0,sandMin:0,gymN:0,gymMin:0,mSum:0,mN:0,eSum:0,eN:0,meals:0,slSum:0,slN:0,sandOff:0,gymOff:0,rest:0,load:0,rpeSum:0,rpeN:0,stSum:0,stN:0,sqSum:0,sqN:0};
  for(const id of ids){const d=getDay(id);if(!hasData(d))continue;r.days++;
    if(d.off?.sand)r.sandOff++; if(d.off?.gym)r.gymOff++;
    if(!(d.sand||[]).length&&!(d.gym||[]).length&&(d.off?.sand||d.off?.gym))r.rest++;
    r.sandN+=(d.sand||[]).length;r.sandMin+=sumMin(d.sand);r.gymN+=(d.gym||[]).length;r.gymMin+=sumMin(d.gym);
    if(d.morning){r.mSum+=d.morning;r.mN++} if(d.fatigue){r.eSum+=d.fatigue;r.eN++}
    r.meals+=mealsCount(d); if(d.sleep){r.slSum+=d.sleep;r.slN++}
    if(d.stress){r.stSum+=d.stress;r.stN++} if(d.sleepQ){r.sqSum+=d.sleepQ;r.sqN++}
    for(const x of [...(d.sand||[]),...(d.gym||[])])if(x.rpe){r.rpeSum+=x.rpe;r.rpeN++;r.load+=(Number(x.min)||0)/60*x.rpe}}
  r.m=r.mN?r.mSum/r.mN:0;r.e=r.eN?r.eSum/r.eN:0;r.sl=r.slN?r.slSum/r.slN:0;r.st=r.stN?r.stSum/r.stN:0;r.sq=r.sqN?r.sqSum/r.sqN:0;r.rpe=r.rpeN?r.rpeSum/r.rpeN:0;r.load=Math.round(r.load*10)/10;return r;
}

// ids = dny období, prev = stejně dlouhé předchozí období; you=true → oslovení hráčky, jinak 3. osoba (trenér)
function tips(ids,prev,you){
  const a=agg(ids), p=prev&&prev.length?agg(prev):null, out=[];
  const T=(l,t2,t3)=>out.push({l,t:you?t2:t3});
  const need=Math.min(3,ids.length);
  if(!a.days){T("info",`Za tohle období zatím nic zapsaného. Rady se objeví, jakmile začneš vyplňovat.`,`Za tohle období zatím nic nezapsala.`);return out}
  if(a.days<need)T("info",`Zatím máš zapsané ${a.days} ${dny(a.days)}. Vyplňuj deník co nejčastěji, ať jsou rady přesné.`,`Zapsané má jen ${a.days} ${dny(a.days)}, rady jsou zatím orientační.`);
  if(a.sl){if(a.sl<7)T("bad",`Spíš v průměru jen ${fmtH(a.sl)}. To je málo – zkus chodit spát dřív, cílem je aspoň 8 hodin.`,`Spí v průměru jen ${fmtH(a.sl)} – málo, cíl je aspoň 8 hodin.`);
    else if(a.sl<8)T("warn",`Spíš v průměru ${fmtH(a.sl)}, těsně pod doporučenými 8 hodinami. Půl hodiny navíc by pomohla.`,`Spí v průměru ${fmtH(a.sl)}, těsně pod 8 hodinami.`)}
  if(a.sq&&a.sq<=2.5)T("warn",`Spánek máš spíš nekvalitní (ø ${dec(a.sq)}/5). Pomáhá klidný večer bez mobilu a pravidelný čas usínání.`,`Kvalita spánku je nízká (ø ${dec(a.sq)}/5).`);
  if(a.m&&a.m<=2.5)T("bad",`Ráno se cítíš málo připravená (ø ${dec(a.m)}/5). Tělo si říká o odpočinek – zvaž lehčí den.`,`Ráno se cítí málo připravená (ø ${dec(a.m)}/5).`);
  if(a.e&&a.e>=4)T("bad",`Večer jsi velmi unavená (ø ${dec(a.e)}/5). Je čas trochu ubrat a víc regenerovat.`,`Večer je velmi unavená (ø ${dec(a.e)}/5) – zvážit ubrání zátěže.`);
  else if(a.e&&a.e>=3.5)T("warn",`Únava se večer drží vysoko (ø ${dec(a.e)}/5). Hlídej spánek a regeneraci.`,`Večerní únava je zvýšená (ø ${dec(a.e)}/5).`);
  if(a.st&&a.st>=4)T("bad",`Tvůj stres mimo sport je hodně vysoký (ø ${dec(a.st)}/5). Najdi si čas na odpočinek a klidně si o tom promluv s trenérem.`,`Stres mimo sport je vysoký (ø ${dec(a.st)}/5) – stojí za rozhovor.`);
  else if(a.st&&a.st>=3.5)T("warn",`Stres mimo sport je zvýšený (ø ${dec(a.st)}/5). Pozor, ať se nesčítá s tréninkovou únavou.`,`Stres mimo sport je zvýšený (ø ${dec(a.st)}/5).`);
  if(p&&p.load>0&&a.load>p.load*1.3){const pc=Math.round((a.load/p.load-1)*100);T("warn",`Zátěž vzrostla o ${pc} % oproti minulému období. Při takovém skoku víc dbej na spánek a regeneraci.`,`Zátěž vzrostla o ${pc} % proti minulému období.`)}
  if(a.rpe>=8.5)T("warn",`Tréninky hodnotíš jako velmi náročné (ø ${dec(a.rpe)}/10). Zařaď i lehčí jednotky.`,`Tréninky hodnotí jako velmi náročné (ø ${dec(a.rpe)}/10).`);
  if(ids.length>=7&&a.days>=5&&a.rest===0&&(a.sandN+a.gymN)>=5)T("warn",`Neměla jsi žádný den volna. I odpočinek je součást tréninku.`,`Neměla žádný den volna.`);
  if(a.days){const pct=a.meals/(a.days*5);
    if(pct<0.85){const miss={};for(const id of ids){const d=getDay(id);if(!hasData(d))continue;for(const [k,l] of MEALS)if(!ate(d.meals?.[k]))miss[l]=(miss[l]||0)+1}
      const top=Object.entries(miss).sort((x,y)=>y[1]-x[1])[0];
      T(pct<0.6?"bad":"warn",`Vynecháváš jídla (${Math.round(pct*100)} % jídel).${top?` Nejčastěji ${top[0].toLowerCase()}.`:""} Pravidelné jídlo je palivo na trénink.`,`Vynechává jídla (${Math.round(pct*100)} %)${top?`, nejčastěji ${top[0].toLowerCase()}`:""}.`)}}
  if(!out.some(x=>x.l==="bad"||x.l==="warn")&&a.days>=need)T("good",`Vypadá to vyrovnaně – spánek, únava i jídlo jsou v pořádku. Jen tak dál!`,`Vše v normě.`);
  return out;
}

}

function svgWrap(W,H,g,label){return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block" role="img" aria-label="${label}">${g}</svg>`}
function sleepChart(ids){
  const W=360,H=160,L=34,B=22,T=18,ph=H-B-T;
  const v=ids.map(id=>Number(getDay(id)?.sleep)||0); const top=Math.max(10,Math.ceil(Math.max(...v)/2)*2);
  const y=h=>T+ph-(h/top)*ph, bw=(W-L-6)/7; let g="";
  for(let t=0;t<=top;t+=2)g+=`<line x1="${L}" x2="${W-4}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${y(t)+3}" text-anchor="end">${t} h</text>`;
  v.forEach((h,i)=>{const x=L+i*bw+bw*.2,w=bw*.6;
    if(h){g+=`<rect class="tipt" data-day="${ids[i]}" data-tip="${DAYS[i]}: spánek ${fmtH(h)}" x="${x}" y="${y(h)}" width="${w}" height="${y(0)-y(h)}" rx="2" fill="var(--ink)" fill-opacity=".75"/><text x="${x+w/2}" y="${y(h)-4}" text-anchor="middle">${fmtShort(h*60)}</text>`}
    g+=`<text x="${x+w/2}" y="${H-6}" text-anchor="middle">${DSHORT[i]}</text>`});
  g+=`<line x1="${L}" x2="${W-4}" y1="${y(8)}" y2="${y(8)}" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  return svgWrap(W,H,g,"Hodiny spánku po dnech");
}
function feelChart(ids){
  const W=360,H=160,L=34,B=22,T=12,ph=H-B-T,bw=(W-L-6)/7;
  const y=v=>T+ph-((v-1)/4)*ph, X=i=>L+i*bw+bw/2; let g="";
  for(let t=1;t<=5;t++)g+=`<line x1="${L}" x2="${W-4}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${y(t)+3}" text-anchor="end">${t}</text>`;
  ids.forEach((id,i)=>g+=`<text x="${X(i)}" y="${H-6}" text-anchor="middle">${DSHORT[i]}</text>`);
  for(const [k,c,lab,LBL] of [["morning","var(--am)","Připravenost",FEEL],["fatigue","var(--pm)","Únava",FATIG]]){
    const pts=ids.map((id,i)=>{const v=getDay(id)?.[k];return v?[X(i),y(v),v,id]:null});
    for(let i=1;i<7;i++)if(pts[i]&&pts[i-1])g+=`<line x1="${pts[i-1][0]}" y1="${pts[i-1][1]}" x2="${pts[i][0]}" y2="${pts[i][1]}" stroke="${c}" stroke-width="2.5" stroke-linecap="round"/>`;
    pts.forEach(p=>{if(p)g+=`<g class="tipt" data-day="${p[3]}" data-tip="${DAYS[dow(parse(p[3]))]} ${parse(p[3]).getDate()}.${parse(p[3]).getMonth()+1}. · ${lab}: ${p[2]} – ${LBL[p[2]]}"><circle cx="${p[0]}" cy="${p[1]}" r="12" fill="transparent"/><circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="${c}" stroke="var(--surface)" stroke-width="1.5"/></g>`});
  }
  return svgWrap(W,H,g,"Připravenost a únava po dnech");
}
function loadChart(wk){
  const W=360,H=160,L=40,B=22,T=18,ph=H-B-T,n=wk.length,bw=(W-L-6)/n;
  const v=wk.map(w=>w.a.load); const mx=Math.max(...v);
  if(!mx)return `<p class="note">Zatím bez dat. Vyplňte u tréninků náročnost 1–10.</p>`;
  const step=Math.pow(10,Math.floor(Math.log10(mx)))*(mx/Math.pow(10,Math.floor(Math.log10(mx)))>5?2:1)/1;
  const top=Math.ceil(mx/step)*step, y=a=>T+ph-(a/top)*ph; let g="";
  for(let t=0;t<=top;t+=step)g+=`<line x1="${L}" x2="${W-4}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${y(t)+3}" text-anchor="end">${Math.round(t*10)/10}</text>`;
  v.forEach((a,i)=>{const x=L+i*bw+bw*.22,w=bw*.56;
    if(a)g+=`<rect class="tipt" data-week="${key(wk[i].s)}" data-tip="${isoWeek(wk[i].s)}. týden: zátěž ${ld(a)}" x="${x}" y="${y(a)}" width="${w}" height="${y(0)-y(a)}" rx="2" fill="var(--accent)"/><text x="${x+w/2}" y="${y(a)-4}" text-anchor="middle">${ld(a)}</text>`;
    g+=`<text x="${x+w/2}" y="${H-6}" text-anchor="middle">${isoWeek(wk[i].s)}. týden</text>`});
  return svgWrap(W,H,g,"Tréninková zátěž po týdnech");
}
function chart(ids,week){
  const W=week?360:Math.max(340,ids.length*18+40),H=170,L=34,B=22,T=week?20:10,ph=H-B-T;
  const vals=ids.map(id=>{const d=getDay(id);return{s:sumMin(d?.sand),g:sumMin(d?.gym)}});
  const max=Math.max(60,...vals.map(v=>v.s+v.g)); const top=Math.ceil(max/60)*60;
  const bw=(W-L-6)/ids.length;
  let g="";
  for(let t=0;t<=top;t+=60){const yy=T+ph-(t/top)*ph;g+=`<line x1="${L}" x2="${W-4}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${yy+3}" text-anchor="end">${t/60} h</text>`}
  vals.forEach((v,i)=>{const x=L+i*bw+bw*.18,w=bw*.64;const hs=(v.s/top)*ph,hg=(v.g/top)*ph;
    if(v.s)g+=`<rect class="tipt" data-day="${ids[i]}" data-tip="${parse(ids[i]).getDate()}.${parse(ids[i]).getMonth()+1}.: písek ${fmtMin(v.s)}" x="${x}" y="${T+ph-hs}" width="${w}" height="${hs}" fill="var(--sand)" rx="2"></rect>`;
    if(v.g)g+=`<rect class="tipt" data-day="${ids[i]}" data-tip="${parse(ids[i]).getDate()}.${parse(ids[i]).getMonth()+1}.: posilovna ${fmtMin(v.g)}" x="${x}" y="${T+ph-hs-hg}" width="${w}" height="${hg}" fill="var(--gym)" rx="2"></rect>`;
    const dd=parse(ids[i]); if(week){g+=`<text x="${x+w/2}" y="${H-6}" text-anchor="middle">${DSHORT[i]}</text>`;const tot=v.s+v.g;if(tot)g+=`<text x="${x+w/2}" y="${T+ph-hs-hg-4}" text-anchor="middle">${fmtShort(tot)}</text>`}else if(dd.getDate()===1||dow(dd)===0)g+=`<text x="${x+w/2}" y="${H-6}" text-anchor="middle">${dd.getDate()}.</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block" role="img" aria-label="Minuty tréninku po dnech">${g}</svg>`;
}

function live(table,filter,run){
  let alive=true;const go=()=>{if(alive)run()};go();
  let ch=null;
  try{ch=SB.channel(table+"-"+Math.random().toString(36).slice(2)).on("postgres_changes",Object.assign({event:"*",schema:"public",table},filter?{filter}:{}),go).subscribe()}catch(e){}
  const t=setInterval(go,60000);
  const vis=()=>{if(document.visibilityState==="visible")go()};document.addEventListener("visibilitychange",vis);
  return ()=>{alive=false;clearInterval(t);document.removeEventListener("visibilitychange",vis);if(ch)try{SB.removeChannel(ch)}catch(e){}};
}
function mkDB(){
  return {
    collection(path){
      if(path==="players"){
        const get=async()=>{const {data,error}=await SB.from("players").select("id,name,since,is_coach");if(error)throw error;return snapOf(data.map(r=>[r.id,{name:r.name,since:r.since,is_coach:r.is_coach}]))};
        return {get,onSnapshot(cb,err){return live("players",null,()=>get().then(cb).catch(e=>err&&err(e)))}};
      }
      const [,pid,kind]=path.split("/");
      const get=async()=>{const {data,error}=await SB.from("entries").select("key,data").eq("owner",pid).eq("kind",kind);if(error)throw error;return snapOf(data.map(r=>[r.key,r.data]))};
      return {
        get,
        onSnapshot(cb,err){return live("entries","owner=eq."+pid,()=>get().then(cb).catch(e=>err&&err(e)))},
        doc(id){return {
          set:async b=>{const {error}=await SB.from("entries").upsert({owner:pid,kind,key:id,data:b,updated_at:new Date().toISOString()});if(error)throw error},
          delete:async()=>{const {error}=await SB.from("entries").delete().eq("owner",pid).eq("kind",kind).eq("key",id);if(error)throw error}
        }}
      };
    },
    doc(path){
      const id=path.split("/")[1];
      return {
        get:async()=>{const {data,error}=await SB.from("players").select("id,name,since,is_coach").eq("id",id).maybeSingle();if(error)throw error;return {exists:!!data,data:()=>data}},
        set:async b=>{const {error}=await SB.from("players").insert(Object.assign({id},b));if(error)throw error},
        update:async b=>{const {error}=await SB.from("players").update(b).eq("id",id);if(error)throw error},
        delete:async()=>{}
      };
    }
  };
}

  $("#authForm").onsubmit=async e=>{e.preventDefault();email=$("#authEmail").value.trim();
    if(!/^\S+@\S+\.\S+$/.test(email)){authMsg("Zadej platný e-mail, třeba jmeno@email.cz.");return}
    $("#authSend").disabled=true;authMsg("Posílám…");
    const {error}=await SB.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:true}});
    $("#authSend").disabled=false;
    if(error){const em=String(error.message||error.code||error);authMsg((/rate|seconds/i.test(em)?"E-mail jsme posílali před chvílí. Zkus to znovu za minutu.":/signup|not allowed/i.test(em)?"Registrace nových hráček je v databázi vypnutá. Dej vědět trenérovi.":"E-mail se nepodařilo poslat. Zkontroluj adresu a zkus to znovu.")+" (Chyba: "+em+")");return}
    authMsg("");$("#authForm").hidden=true;$("#codeForm").hidden=false;
    $("#codeInfo").textContent=`Poslali jsme e-mail na ${email}. Opiš sem kód z e-mailu. Na iPhonu v aplikaci z plochy použij vždy kód, ne odkaz.`;$("#authCode").focus()};
  $("#codeForm").onsubmit=async e=>{e.preventDefault();const token=$("#authCode").value.replace(/\s/g,"");
    if(!/^\d{6,10}$/.test(token)){authMsg("Opiš celý číselný kód z e-mailu.");return}
    $("#codeSend").disabled=true;authMsg("Ověřuju…");
    let {error}=await SB.auth.verifyOtp({email,token,type:"email"});
    if(error){const r=await SB.auth.verifyOtp({email,token,type:"signup"});if(!r.error)error=null}
    $("#codeSend").disabled=false;
    if(error){authMsg("Kód nesedí nebo vypršel. Zkontroluj ho, případně si nech poslat nový.");return}
    authMsg("")};
  $("#codeBack").onclick=()=>{$("#codeForm").hidden=true;$("#authForm").hidden=false;authMsg("")};
  $("#logout").onclick=async()=>{await SB.auth.signOut();location.replace(location.pathname)};
}
async function askName(){
  return new Promise(res=>{
    $("#nameBox").hidden=false;
    $("#nameForm").onsubmit=async e=>{e.preventDefault();const n=$("#nameIn").value.trim();
      if(n.length<2){$("#nameMsg").textContent="Napiš své jméno.";return}
      try{await DB.doc("players/"+me).update({name:n});$("#nameBox").hidden=true;res(n)}
      catch(x){$("#nameMsg").textContent="Jméno se nepodařilo uložit. Zkus to znovu."}};
  });
}
let booted=false;
async function bootFor(session){
  if(booted)return; booted=true;
  me=session.user.id; showAuth(false); $("#nameBox").hidden=true;
  if(location.search||/access_token|error|type=/.test(location.hash))history.replaceState(null,"",location.pathname);
  mode="db";
  store={save:(c,id,b)=>DB.collection(base+"/"+c).doc(id).set(b),remove:(c,id)=>DB.collection(base+"/"+c).doc(id).delete()};
  let row=null;
  try{const r=DB.doc("players/"+me);let sn=await r.get();if(!sn.exists){await r.set({since:key(today())});sn=await r.get()}row=sn.data()}catch(e){setStatus("Nepodařilo se načíst účet. Obnov stránku.");return}
  isCoach=!!(row&&row.is_coach);
  $("#tab-trener").hidden=!isCoach;
  if(isCoach){
    $("#coachbar").hidden=false;
    $("#psel").onchange=e=>selectPlayer(e.target.value);
    DB.collection("players").onSnapshot(async snap=>{
      players=snap.docs.filter(d=>d.exists&&!d.data().is_coach).map(d=>({id:d.id,...d.data()})).sort((x,y)=>String(x.since||"").localeCompare(String(y.since||"")));
      await loadNames();
      if(selPid&&!players.some(p=>p.id===selPid))selPid=null;
      if(!selPid&&players.length)selectPlayer(players[0].id);
      if(!players.length){setStatus("Zatím žádná hráčka");render(null,true)}
      if(currentView==="trener")renderTeam();
    },()=>{});
    route();
  }else{
    if(!row||!row.name){document.body.classList.add("locked");await askName();document.body.classList.remove("locked")}
    selectPlayer(me);
  }
}
(async()=>{
  if(!CFG.supabaseUrl||!CFG.supabaseAnonKey||!window.supabase){
    showAuth(false);$("#logout").hidden=true;document.body.classList.add("locked");
    setStatus("Aplikace ještě není propojená s databází. Doplň config.js podle návodu v README.");return}
  SB=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey,{auth:{flowType:"implicit",detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});
  DB=mkDB(); wireAuth();
  SB.auth.onAuthStateChange((ev,session)=>{if(session)bootFor(session)});
  const {data}=await SB.auth.getSession();
  if(data.session)bootFor(data.session);
  else{showAuth(true);setStatus("Nepřihlášeno");
    const u=new URLSearchParams(location.search+"&"+location.hash.replace(/^#/,""));
    const err=u.get("error_code")||u.get("error");
    if(err){authMsg(/expired|otp/i.test(err+u.get("error_description"))?"Odkaz v e-mailu už vypršel nebo byl použitý. Nech si poslat nový.":"Přihlášení přes odkaz se nepovedlo ("+(u.get("error_description")||err).replace(/\+/g," ")+"). Nech si poslat nový e-mail.");history.replaceState(null,"",location.pathname)}}
})();

})();
</script>
